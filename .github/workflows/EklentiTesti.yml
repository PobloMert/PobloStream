# Haftalık eklenti testi: her eklenti gerçek sitede ana sayfa + detay sayfası açar; sonuç tablosu
# çalışmanın Summary sayfasına yazılır.
# ! YALNIZCA RAPOR: GitHub sunucuları yurt dışında; birçok site (ve TRT yayını) yurt dışından gelen
# ! bağlantıya boş sayfa/hata veriyor. Bu yüzden burada eklenti durumu (status) DEĞİŞTİRİLMEZ.
# ! Durum değişikliği Türkiye'den elle yapılır:  ./gradlew testDebugUnitTest --continue && python EKLENTI_TESTI.py --durum
name: Eklenti Testi

on:
  schedule:
    - cron: "0 6 * * 1"   # her pazartesi 09:00 (TR), adres denetiminden 1 saat sonra
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eklenti-testi
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-java@v4.6.0
        with:
          distribution: adopt
          java-version: 21

      - name: Android SDK Ayarla
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Eklentileri test et
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --continue || true

      - name: Sonuçları topla
        id: sonuc
        run: |
          python3 EKLENTI_TESTI.py --rapor "$RUNNER_TEMP/rapor.md"
          cat "$RUNNER_TEMP/rapor.md" >> "$GITHUB_STEP_SUMMARY"
