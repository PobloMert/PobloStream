# Haftalık eklenti testi: her eklenti gerçek sitede ana sayfa + detay sayfası açar.
# Bozulan eklentiyi "çalışmıyor" (status = 0), düzelen eklentiyi yeniden "çalışıyor" (1) yapan bir PR açar.
name: Eklenti Testi

on:
  schedule:
    - cron: "0 6 * * 1"   # her pazartesi 09:00 (TR), adres denetiminden 1 saat sonra
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: eklenti-testi
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-java@v4.6.0
        with:
          distribution: adopt
          java-version: 21

      - name: Android SDK Ayarla
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Eklentileri test et
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --continue || true

      - name: Sonuçları topla
        id: sonuc
        run: |
          python3 EKLENTI_TESTI.py --durum --rapor "$RUNNER_TEMP/rapor.md"
          cat "$RUNNER_TEMP/rapor.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Durumu değişen eklentiler için PR aç
        if: steps.sonuc.outputs.degisti == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dal=otomatik/eklenti-durumu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$dal"
          git add -- '*/build.gradle.kts'
          git commit -m "Eklenti durumlari guncellendi (otomatik test)"
          git push --force origin "$dal"
          if gh pr view "$dal" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$dal" --body-file "$RUNNER_TEMP/rapor.md"
          else
            gh pr create --base master --head "$dal" \
              --title "Eklenti durumları güncellendi" --body-file "$RUNNER_TEMP/rapor.md"
          fi
