# Bu araç @keyiflerolsun tarafından | @KekikAkademi için yazılmıştır.
# builds dalıYoksa otomatik oluşturulur (Ahmet/PobloStream uyarlaması).
name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.jpg"
      - "**/*.png"
      - "**/*.py"

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "'src' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          path: "src"

      - name: "Builds dalını hazırla (yoksa oluştur)"
        run: |
          mkdir -p $GITHUB_WORKSPACE/builds
          cd $GITHUB_WORKSPACE/builds
          git init
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch --depth=1 origin builds 2>/dev/null || true
          if git rev-parse --verify --quiet FETCH_HEAD >/dev/null; then
            git checkout -b builds FETCH_HEAD
            echo "Mevcut builds dalı kullanıldı."
          else
            git checkout -b builds
            echo "# PobloStream derlemeleri" > README.md
            git add README.md
            git commit -m "builds dalını oluştur"
            git push origin builds
            echo "Yeni builds dalı oluşturuldu."
          fi

      - name: Eski Derlemeleri Temizle
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3 || true

      - name: JDK Ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: adopt
          java-version: 21

      - name: Android SDK Ayarla
        uses: android-actions/setup-android@v3.2.2

      - name: Eklentileri Derle
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          cp */build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Derlemeleri Yükle
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "$GITHUB_SHA derlemesi" || echo "Yeni değişiklik yok"
          git push origin builds
