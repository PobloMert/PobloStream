# Bu araç @keyiflerolsun tarafından | @KekikAkademi için yazılmıştır.
# builds dalıYoksa otomatik oluşturulur (Ahmet/PobloStream uyarlaması).
name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.jpg"
      - "**/*.png"
      - "**/*.py"
      - "domains.json"

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "'src' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          path: "src"

      - name: "Builds dalını hazırla (yoksa oluştur)"
        run: |
          mkdir -p $GITHUB_WORKSPACE/builds
          cd $GITHUB_WORKSPACE/builds
          git init
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch --depth=1 origin builds 2>/dev/null || true
          if git rev-parse --verify --quiet FETCH_HEAD >/dev/null; then
            git checkout -b builds FETCH_HEAD
            echo "Mevcut builds dalı kullanıldı."
          else
            git checkout -b builds
            echo "# PobloStream derlemeleri" > README.md
            git add README.md
            git commit -m "builds dalını oluştur"
            git push origin builds
            echo "Yeni builds dalı oluşturuldu."
          fi

      - name: Eski Derlemeleri Temizle
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3 || true

      - name: JDK Ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: adopt
          java-version: 21

      - name: Android SDK Ayarla
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
          echo "sdk.dir=$ANDROID_HOME" > $GITHUB_WORKSPACE/src/local.properties
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager bulunamadi, cmdline-tools indiriliyor..."
            mkdir -p /tmp/cmdline-tools
            curl -sL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Eklentileri Derle
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          # CI koşuları aralıklı olarak (ağ/daemon kaynaklı) patlıyor: 3 deneme
          for deneme in 1 2 3; do
            echo "derleme denemesi ${deneme}/3"
            ./gradlew make makePluginsJson && break
            if [ "$deneme" -eq 3 ]; then
              echo "derleme 3 denemede de başarısız"
              exit 1
            fi
            sleep 20
          done
          cp */build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds
          # repo.json'u da builds'e kopyala — kisa kod (!poblostream) buraya yonleniyor
          cp $GITHUB_WORKSPACE/src/repo.json $GITHUB_WORKSPACE/builds/repo.json

      - name: Derlemeleri Yükle
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "$GITHUB_SHA derlemesi" || echo "Yeni değişiklik yok"
          git push origin builds

      # jsdelivr 'builds' dali icin ~12 saat onbellek tutuyor; dal yerine sabit commit
      # adresi kullanarak TV'lerin daima yeni plugins.json'u gormesini sagliyoruz.
      - name: Sabit manifest yayinla
        if: success()
        run: |
          cd $GITHUB_WORKSPACE/builds
          SHA=$(git rev-parse HEAD)
          python3 -c 'import json,sys,time; sha=sys.argv[1]; repo="PobloMert/PobloStream"; f="repo.json"; j=json.load(open(f,encoding="utf-8-sig")); spor="https://raw.githubusercontent.com/PobloMert/PobloStream/builds/spor_plugins.json"; j["pluginLists"]=["https://cdn.jsdelivr.net/gh/"+repo+"@"+sha+"/plugins.json?t="+sha[:12], spor]; j["timestamp"]=int(time.time()); j["lastUpdated"]=j["timestamp"]; json.dump(j,open(f,"w",encoding="utf-8"),ensure_ascii=False,indent=2)' "$SHA"
          git add repo.json
          git commit -m "sabit manifest ${SHA}" || echo "yeni degisiklik yok"
          git push origin builds
